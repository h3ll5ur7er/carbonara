name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm format:check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Generated TS types of the solver IR are up to date
        run: git diff --exit-code src/contracts/ir

  desktop:
    name: Desktop app (Linux)
    # Builds the Tauri shell on every push, so breakage shows before a release tag (release.yml builds installers).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: ./.github/actions/setup # caches target/, where the desktop crate builds too
      - run: cargo clippy -p carbonara-desktop --all-targets -- -D warnings
      - run: cargo test -p carbonara-desktop
      - name: Build the app and its .deb
        # A debug build: it embeds the web build and bundles like a release, minus the slow optimised link.
        run: pnpm desktop:build --debug --bundles deb

  bench:
    name: Performance budgets
    runs-on: ubuntu-latest
    # The budgets from docs/Architecture/Solver.md aren't met yet (see CARB-12): the job reports the
    # numbers and fails, but doesn't block. Remove this line once they are met.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup # builds the WebAssembly module in release mode
      - run: pnpm bench

  e2e:
    name: End-to-end and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy the web app to GitHub Pages
    # Only the default branch deploys, and only after the checks above pass.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [web, rust, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build for https://<owner>.github.io/<repo>/
        run: pnpm exec vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
