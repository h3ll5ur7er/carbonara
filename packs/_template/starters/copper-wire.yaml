# A starter factory (docs/Guides/Pack authoring.md, Starter factories): the first run opens it with the tour.
# Copper plates are smelted and the wire output waits; the tour adds the wire assemblers in between.
name: Copper wire
description: Cuprite ore smelted into copper plates, waiting for wire assemblers.
graph:
  nodes:
    ore: { kind: source, item: cuprite-ore }
    plates: { kind: recipe, recipe: copper-plate }
    slag: { kind: sink, item: slag }
    hint: { kind: note, text: "Add Copper Wire here, then connect it between the plates and the output." }
    wire: { kind: sink, item: copper-wire }
  edges:
    ore-plates: { from: ore, to: plates, item: cuprite-ore }
    plates-slag: { from: plates, to: slag, item: slag }
layout:
  root:
    ore: { x: 0, y: 0 }
    plates: { x: 320, y: 0 }
    slag: { x: 640, y: 240 }
    hint: { x: 640, y: -24 }
    wire: { x: 1000, y: 0 }
