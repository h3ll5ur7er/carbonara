# A starter factory (docs/Guides/Pack authoring.md, Starter factories): the first run opens it with the tour.
# Iron plates are smelted and the gear output waits; the tour adds the assemblers in between.
name: Iron gears
description: Iron ore smelted into plates, waiting for gear assemblers.
graph:
  nodes:
    ore: { kind: source, item: iron-ore }
    plates: { kind: recipe, recipe: iron-plate }
    hint: { kind: note, text: "Add Iron gear wheel here, then connect it between the plates and the output." }
    gears: { kind: sink, item: iron-gear-wheel }
  edges:
    ore-plates: { from: ore, to: plates, item: iron-ore }
layout:
  root:
    ore: { x: 0, y: 0 }
    plates: { x: 320, y: 0 }
    hint: { x: 640, y: -24 }
    gears: { x: 1000, y: 0 }
