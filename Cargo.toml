[workspace]
resolver = "3"
members = ["crates/solver", "crates/solver-wasm"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
