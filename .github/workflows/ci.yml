name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm format:check
      # The e2e job runs in the Playwright image, which can't compile Rust; it takes the module from here.
      - uses: actions/upload-artifact@v4
        with:
          name: solver-wasm
          path: src/engines/solver/wasm
          retention-days: 1

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Generated TS types of the solver IR are up to date
        run: git diff --exit-code src/contracts/ir

  desktop:
    name: Desktop app (Linux)
    # Builds the Tauri shell on every push, so breakage shows before a release tag (release.yml builds installers).
    runs-on: ubuntu-latest
    # A clean run takes about 2 minutes; a hung package mirror shouldn't hold a runner for the default 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's system libraries
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: ./.github/actions/setup # caches target/, where the desktop crate builds too
      - run: cargo clippy -p carbonara-desktop --all-targets -- -D warnings
      - run: cargo test -p carbonara-desktop
      - name: Build the app and its .deb
        # A debug build: it embeds the web build and bundles like a release, minus the slow optimised link.
        run: pnpm desktop:build --debug --bundles deb

  bench:
    name: Performance budgets
    runs-on: ubuntu-latest
    # Blocking: a budget from docs/Architecture/Solver.md or docs/Design.md (Performance) that no longer
    # holds fails the build (CARB-73). Both steps print their numbers.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup # builds the WebAssembly module in release mode
      - run: pnpm bench
      - name: Canvas frame budgets (e2e/canvas-perf.spec.ts)
        if: always()
        run: pnpm exec playwright install --with-deps chromium && pnpm e2e:host
        env:
          E2E_PERF: 1
          CI: true

  e2e:
    name: End-to-end and screenshots
    runs-on: ubuntu-latest
    # The same image `pnpm e2e` uses locally (scripts/e2e.mjs), so screenshots render identically.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    needs: web
    env:
      PLAYWRIGHT_IN_IMAGE: 1
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: solver-wasm
          path: src/engines/solver/wasm
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy the web app to GitHub Pages
    # Only the default branch deploys, and only after the checks above pass.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [web, rust, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build for https://<owner>.github.io/<repo>/
        run: pnpm exec vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
