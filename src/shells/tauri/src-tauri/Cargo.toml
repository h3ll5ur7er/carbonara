[package]
name = "carbonara-desktop"
version = "0.1.0"
description = "Carbonara's desktop shell: the web app in a Tauri window, with native files, menus, updates and MCP"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "carbonara_desktop"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
carbonara-mcp = { path = "../../../../crates/mcp" }
dirs = "7"
# The TLS provider the updater uses too; `carbonara mcp` needs one installed (src/lib.rs).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
