name: Release

# A tag `v1.2.3`, or running this workflow by hand with that version, builds the desktop installers for Linux,
# Windows and macOS and attaches them, with the signed updates and `latest.json`, to a draft GitHub release named
# after the tag. Publishing the draft (which creates the tag when it was run by hand) is what makes installed apps
# update to it. The setup this needs is in docs/Architecture/Desktop.md (Releases).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, as a tag: v1.2.3 (three numbers; the Windows installer refuses suffixes)"
        required: true

permissions:
  contents: write

env:
  # The tag that was pushed, or the version asked for by hand; the release is cut from the commit the run is on.
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  desktop:
    name: Desktop installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # The oldest supported runner: its glibc decides which distributions the AppImage and .deb run on.
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's system libraries
        if: runner.os == 'Linux'
        # Without man-db's index rebuild, which can take many minutes on the runner images (see ci.yml).
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: ./.github/actions/setup
      - name: Both Mac architectures, for the universal app
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Release configuration (version from the tag, updater)
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG isn't a version tag like v1.2.3"
            exit 1
          fi
          if [ -z "$PUBKEY" ]; then
            echo "::error::Set the repository variable TAURI_UPDATER_PUBKEY (docs/Architecture/Desktop.md, Releases)"
            exit 1
          fi
          cat > src/shells/tauri/src-tauri/tauri.release.conf.json <<EOF
          {
            "version": "${TAG#v}",
            "bundle": { "createUpdaterArtifacts": true },
            "plugins": {
              "updater": {
                "pubkey": "$PUBKEY",
                "endpoints": ["https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"]
              }
            }
          }
          EOF
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # `pnpm tauri` runs the CLI in src/shells/tauri, so the configuration path is relative to it.
          projectPath: src/shells/tauri
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ env.TAG }}
          releaseName: Carbonara ${{ env.TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: Desktop installers for Linux (AppImage, .deb, .rpm), Windows (.msi, .exe) and macOS (.dmg).
          releaseDraft: true
          includeUpdaterJson: true
