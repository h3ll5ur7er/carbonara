[workspace]
resolver = "3"
members = ["crates/mcp", "crates/solver", "crates/solver-wasm", "src/shells/tauri/src-tauri"]
# The desktop shell needs WebKitGTK and friends to build on Linux, so plain `cargo test` and `cargo clippy` leave
# it out; `-p carbonara-desktop` builds it (docs/Development.md, Desktop). Add every other new crate to both lists.
default-members = ["crates/mcp", "crates/solver", "crates/solver-wasm"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
