[workspace]
resolver = "3"
members = ["crates/solver", "crates/solver-wasm"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# The LP library does the heavy lifting in tests; optimise it in debug builds too.
[profile.dev.package.microlp]
opt-level = 3

[profile.dev.package.sprs]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
